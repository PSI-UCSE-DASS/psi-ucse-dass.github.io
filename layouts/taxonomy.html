{{ define "main" }}
<section class="cabecera"><div class="contenedor"><h1>{{ .Title }}</h1>{{ with .Content }}<div class="cabecera__txt">{{ . }}</div>{{ end }}</div></section>
<section class="contenedor seccion">
  <ul class="terminos">
    {{ range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a> <span>{{ .Count }}</span></li>
    {{ end }}
  </ul>
</section>
{{ end }}
