name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # compilación diaria (convocatorias abiertas/cerradas, Fase 2)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar contenido
        run: python3 scripts/validar_contenido.py
      - name: Instalar Hugo
        run: |
          curl -sSL -o hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar xzf hugo.tgz hugo
          sudo mv hugo /usr/local/bin/hugo
      - uses: actions/configure-pages@v5
        id: pages
      - name: Compilar
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Indexar búsqueda (Pagefind)
        run: npx --yes pagefind@1.3.0 --site public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
